name: Weekly Sync Upstream & Release

on:
  schedule:
    - cron: "0 18 * * 0"   # 每周一 02:00 北京时间（UTC 周日 18:00）
  workflow_dispatch:
    inputs:
      track:
        description: "跟随目标：auto=上游最新发布版（正式或 beta，哪个新跟哪个）；beta=仅最新 beta 预发布；main=上游 main 分支；ref=手动指定"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - beta
          - main
          - ref
      upstream_ref:
        description: "仅当 track=ref 时使用：上游分支/标签名"
        required: false
        default: "main"
        type: string
      force_release:
        description: "Force release even if no upstream change"
        required: false
        default: false
        type: boolean
      test_mode:
        description: "试合并模式：合并到临时分支并编译验证调速/编译，不出 release、不推送 main、不发布更新清单"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  TZ: Asia/Shanghai

jobs:
  sync-and-release:
    name: Sync upstream, build 4 APKs, release
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.email "action@webhtv.local"
          git config user.name "sync-bot"

      - name: Merge upstream (Silent1566)
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
          TRACK: ${{ inputs.track || 'auto' }}
          UPSTREAM_REF: ${{ inputs.upstream_ref || 'main' }}
          TEST_MODE: ${{ inputs.test_mode || 'false' }}
        run: |
          TEST_MODE="${{ inputs.test_mode || 'false' }}"
          if [ "$TEST_MODE" = "true" ]; then
            TEST_BRANCH="sync-test-${{ github.run_id }}"
            git checkout -b "$TEST_BRANCH"
            echo ">> TEST MODE：合并目标为临时分支 $TEST_BRANCH（不推送 main、不出 release）"
          fi
          git remote add upstream https://github.com/Silent1566/webhtv.git || true
          git remote set-url upstream https://github.com/Silent1566/webhtv.git
          git fetch upstream --tags --force

          # 解析合并目标：auto=最新发布版(正式或beta) / beta / main / 手动 ref
          TARGET=""
          case "$TRACK" in
            auto)
              # 取最新发布的非草稿 release（正式版与 beta 混在一起比 published_at，谁新跟谁）
              TARGET="$(gh api repos/Silent1566/webhtv/releases \
                --jq '[.[] | select(.draft == false)] | sort_by(.published_at) | last | .tag_name')"
              ;;
            beta)
              TARGET="$(gh api repos/Silent1566/webhtv/releases \
                --jq '[.[] | select(.draft == false and .prerelease == true)] | sort_by(.published_at) | last | .tag_name')"
              ;;
            main) TARGET="main" ;;
            ref)  TARGET="$UPSTREAM_REF" ;;
            *)    TARGET="main" ;;
          esac
          if [ -z "$TARGET" ]; then
            echo "::error title=No upstream target::Failed to resolve beta tag or ref"
            exit 1
          fi
          echo "Track mode: $TRACK -> target: $TARGET"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "Upstream target commit: $(git rev-parse --short upstream/$TARGET 2>/dev/null || echo 'tag-only, fetch by tag')"

          # beta 可能是仅存在于 tag 的提交，先确保该 target 对象已取到
          git fetch upstream "refs/tags/$TARGET:refs/tags/upstream-$TARGET" 2>/dev/null || true
          if git rev-parse --verify --quiet "upstream/$TARGET" >/dev/null; then
            REF_TO_MERGE="upstream/$TARGET"
          elif git rev-parse --verify --quiet "refs/tags/upstream-$TARGET" >/dev/null; then
            REF_TO_MERGE="refs/tags/upstream-$TARGET"
          else
            echo "::error title=Target not found::Cannot resolve upstream/$TARGET"
            exit 1
          fi
          echo "Merging: $REF_TO_MERGE"

          BEFORE=$(git rev-parse HEAD)
          git merge -X theirs --no-commit --no-edit "$REF_TO_MERGE" || true
          git checkout $BEFORE -- .github
          if git diff --cached --quiet; then
            git merge --abort 2>/dev/null || true
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No upstream changes."
          else
            git commit --no-edit
            AFTER=$(git rev-parse HEAD)
            if [ "$BEFORE" != "$AFTER" ]; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "changed=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Push result (main or test branch)
        if: steps.merge.outputs.changed == 'true'
        run: |
          if [ "${{ inputs.test_mode || 'false' }}" = "true" ]; then
            echo ">> TEST MODE：推送临时分支（不推送 main）"
            git push origin HEAD
          else
            git push origin main
          fi

      - name: Ensure fullscreen speed-key customization
        id: guard
        if: steps.merge.outputs.changed == 'true' || inputs.force_release == true
        run: |
          # 上游合并可能覆盖「全屏播放中短按上下键调速」定制，release 前检查并自动修复
          BEFORE_GUARD=$(git rev-parse HEAD)
          if bash scripts/ensure_fullscreen_speed_keys.sh; then
            if [ -n "$(git status --porcelain)" ]; then
              git config user.email "action@webhtv.local"
              git config user.name "sync-bot"
              git add -A app/src/leanback
              git commit -m "fix(leanback): 重新应用全屏上下键调速定制（上游合并后自动修复）"
              echo "Patched=true" >> "$GITHUB_OUTPUT"
              echo "::notice title=全屏调速定制已重新应用::上游合并覆盖了调速逻辑，已自动修复"
            else
              echo "Patched=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "Patched=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=全屏调速定制需人工检查::自动修复失败，请检查 VideoActivity/CustomKeyDownVod"
          fi

      - name: Push guard fixes
        if: steps.guard.outputs.Patched == 'true'
        run: |
          if [ "${{ inputs.test_mode || 'false' }}" = "true" ]; then
            git push origin HEAD
          else
            git push origin main
          fi

      - name: Determine build scope (beta=TV v7a only / stable=all 4)
        id: scope
        if: steps.merge.outputs.changed == 'true' || inputs.force_release == true
        env:
          TARGET: ${{ steps.merge.outputs.target }}
          TRACK: ${{ inputs.track || 'auto' }}
        run: |
          # beta 跟随时只构建电视 v7a（leanback armeabi-v7a）；正式版构建全量 4 个包
          if [ "${{ inputs.test_mode || 'false' }}" = "true" ]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "scope=beta" >> "$GITHUB_OUTPUT"
            echo "TEST MODE：强制仅编电视 v7a 以快速验证"
          elif [[ "$TARGET" == *-beta-* ]] && [ "$TARGET" != "main" ] && [ -n "$TARGET" ]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "scope=beta" >> "$GITHUB_OUTPUT"
            echo "构建范围：beta（仅电视 leanback armeabi-v7a）"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "scope=stable" >> "$GITHUB_OUTPUT"
            echo "构建范围：正式版（全量 4 flavor）"
          fi

      - name: Set up JDK 21
        if: steps.merge.outputs.changed == 'true' || inputs.force_release == true
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Python 3.10
        if: steps.merge.outputs.changed == 'true' || inputs.force_release == true
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Android SDK
        if: steps.merge.outputs.changed == 'true' || inputs.force_release == true
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android packages
        if: steps.merge.outputs.changed == 'true' || inputs.force_release == true
        run: |
          sdkmanager "platform-tools" "platforms;android-28" "build-tools;36.0.0"
          curl -fsSL -o /tmp/platform-37.zip https://dl.google.com/android/repository/platform-37.0_r01.zip
          rm -rf /tmp/platform-37 "$ANDROID_HOME/platforms/android-37"
          mkdir -p /tmp/platform-37 "$ANDROID_HOME/platforms"
          unzip -q /tmp/platform-37.zip -d /tmp/platform-37
          platform_jar="$(find /tmp/platform-37 -name android.jar -print -quit)"
          test -n "$platform_jar"
          mv "$(dirname "$platform_jar")" "$ANDROID_HOME/platforms/android-37"

      - name: Grant execute permission for gradlew
        if: steps.merge.outputs.changed == 'true' || inputs.force_release == true
        run: chmod +x ./gradlew

      - name: Drop JetBrains daemon JVM toolchain (foojay 400 workaround)
        if: steps.merge.outputs.changed == 'true' || inputs.force_release == true
        run: |
          # gradle/gradle-daemon-jvm.properties 强制用 JetBrains JDK 21 并走 foojay 下载，
          # 当前 foojay 对该 ID 返回 400 导致守护进程起不来。删除后 Gradle 改用已装好的
          # Temurin JDK 21（setup-java 提供）运行守护进程，编译不受影响。仅改工作树，不提交。
          rm -f gradle/gradle-daemon-jvm.properties
          echo "org.gradle.java.installations.auto-download=false" >> gradle.properties

      - name: Setup fixed debug signing keystore (固定签名，解决覆盖安装)
        if: steps.merge.outputs.changed == 'true' || inputs.force_release == true
        run: |
          mkdir -p ~/.android
          rm -f ~/.android/debug.keystore
          "$JAVA_HOME/bin/keytool" -importkeystore \
            -srckeystore ci/debug.keystore.p12 \
            -srcstoretype PKCS12 -srcstorepass android -srckeypass android \
            -srcalias androiddebugkey \
            -destkeystore ~/.android/debug.keystore \
            -deststoretype JKS -deststorepass android -destkeypass android
          echo ">> 固定 debug keystore 已就位 (alias=androiddebugkey, storepass=android)"

      - name: Build debug APKs by scope - beta TV v7a only, stable all 4
        id: build
        if: steps.merge.outputs.changed == 'true' || inputs.force_release == true
        env:
          SCOPE: ${{ steps.scope.outputs.scope }}
        run: |
          VCODE=$(date +%Y%m%d%H)
          echo "vcode=$VCODE" >> "$GITHUB_OUTPUT"
          echo ">> 注入 versionCode=$VCODE (覆盖默认 560，确保 app 内可检测新版本)"
          if [ "$SCOPE" = "beta" ]; then
            echo ">> beta 构建：仅电视 leanback armeabi-v7a"
            ./gradlew :app:assembleLeanbackArmeabi_v7aDebug --no-daemon -Pvcode=$VCODE
          else
            echo ">> 正式版构建：全量 4 flavor"
            ./gradlew \
              :app:assembleMobileArm64_v8aDebug \
              :app:assembleMobileArmeabi_v7aDebug \
              :app:assembleLeanbackArm64_v8aDebug \
              :app:assembleLeanbackArmeabi_v7aDebug \
              --no-daemon -Pvcode=$VCODE
          fi
          APK=$(find app/build/outputs/apk -name '*.apk' | head -1)
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" 2>/dev/null | grep -i version || echo "aapt 校验跳过"

      - name: Collect artifacts
        if: steps.merge.outputs.changed == 'true' || inputs.force_release == true
        env:
          SCOPE: ${{ steps.scope.outputs.scope }}
        run: |
          rm -rf dist
          mkdir -p dist
          find app/build/outputs/apk -name '*.apk' -exec cp {} dist/ \;
          ls -lh dist/
          if [ "$SCOPE" = "beta" ]; then
            # beta 仅发布电视 v7a，避免多余包
            find dist -name '*.apk' ! -name 'app-leanback-armeabi_v7a-*' -print -delete
            echo "beta 模式：仅保留 ->"
            ls -lh dist/
          fi

      - name: Resolve release tag
        id: meta
        if: steps.merge.outputs.changed == 'true' && inputs.test_mode != true
        env:
          TARGET: ${{ steps.merge.outputs.target }}
          TRACK: ${{ inputs.track || 'auto' }}
        run: |
          VERSION_NAME="$(sed -n 's/^[[:space:]]*versionName[[:space:]]*"\([^"]*\)".*/\1/p' app/build.gradle | head -1)"
          # 跟随上游 tag 时保留其 beta 标识（去掉版本号前缀避免重复 v5.6.0-sync-5.6.0-...）
          PRERELEASE=false
          if [[ "$TARGET" == *-beta-* ]] && [ "$TARGET" != "main" ] && [ -n "$TARGET" ]; then
            TAG="v${VERSION_NAME}-sync-beta-${TARGET##*-beta-}"   # v5.6.0-beta-202610052020 -> v5.6.0-sync-beta-202610052020
            PRERELEASE=true
          else
            TAG="v${VERSION_NAME}-weekly-$(date +%Y%m%d)"
            PRERELEASE=false
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "Source: track=$TRACK target=$TARGET"

      - name: Build release notes (期间更新内容)
        id: notes
        if: steps.merge.outputs.changed == 'true' && inputs.test_mode != true
        env:
          TARGET: ${{ steps.merge.outputs.target }}
          TRACK: ${{ inputs.track || 'auto' }}
          TAG: ${{ steps.meta.outputs.tag }}
          SCOPE: ${{ steps.scope.outputs.scope }}
        run: |
          PREV_TAG="$(gh release list -R "${{ github.repository }}" --limit 100 --json tagName \
            --jq '[.[] | select(.tagName != env.TAG)] | sort_by(.tagName) | last | .tagName // ""' 2>/dev/null || echo '')"
          echo "Previous release: ${PREV_TAG:-（无）}"
          {
            echo "## 本项目定制构建（qznet/webhtv-silent1566）"
            echo
            echo "- 跟随上游：\`Silent1566/webhtv\`（track=\`$TRACK\`，目标 \`$TARGET\`）"
            echo "- 对比上一版本：${PREV_TAG:-无（首个版本）}"
            echo
            if [ "$SCOPE" = "beta" ]; then
              echo "### 本次包（beta 仅电视版）"
              echo "- \`app-leanback-armeabi_v7a-debug.apk\` —— 电视版（v7a）"
              echo
            else
              echo "### 本次包（正式版全量 4 个）"
              echo "- \`app-leanback-arm64_v8a-debug.apk\` —— 电视版（arm64）"
              echo "- \`app-leanback-armeabi_v7a-debug.apk\` —— 电视版（v7a）"
              echo "- \`app-mobile-arm64_v8a-debug.apk\` —— 手机版（arm64）"
              echo "- \`app-mobile-armeabi_v7a-debug.apk\` —— 手机版（v7a）"
              echo
            fi
            echo "### 本仓库定制"
            echo "- 全屏播放中：短按上下键调节倍速（±0.1，范围 0.25–5.0），暂停时不生效"
            echo "- 长按下键：唤出控制栏；长按上键：连续调速（上游原有行为）"
            echo
            echo "### 更新内容"
            if [ -n "$PREV_TAG" ]; then
              echo '```'
              gh release view "$PREV_TAG" -R "${{ github.repository }}" --json body --jq .body 2>/dev/null \
                | head -40 || echo "（无法读取上一版本说明）"
              echo '```'
            else
              echo "- 首次同步上游 tag \`$TARGET\` 的构建。"
            fi
            echo
            echo "### 说明"
            echo "- 调试版（debug）免签名构建，可直接 sideload 安装。"
            echo "- 本仓库为 GitHub Import 副本，非 fork；每周自动跟随上游最新发布版。"
          } > release-notes.md
          echo "tag_prev=$PREV_TAG" >> "$GITHUB_OUTPUT"
          cat release-notes.md

      - name: Create GitHub Release
        if: steps.merge.outputs.changed == 'true' && inputs.test_mode != true
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        run: |
          REPO="${{ github.repository }}"
          PRERELEASE_FLAG=""
          if [ "$PRERELEASE" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          TAG="${{ steps.meta.outputs.tag }}"
          # 更新已存在的 release 时，同时更新说明
          if gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" -R "$REPO" dist/*.apk --clobber
            gh release edit "$TAG" -R "$REPO" --notes-file release-notes.md \
              $([ "$PRERELEASE" = "true" ] && echo "--prerelease" || echo "")
          else
            gh release create "$TAG" \
              -R "$REPO" \
              --target main \
              --title "$TAG" \
              --notes-file release-notes.md \
              $PRERELEASE_FLAG \
              dist/*.apk
          fi

          # 清理不在本次发布范围内的历史资产（beta 只发 v7a 时移除旧的 arm64/mobile 包）
          echo "本次发布包含："
          (cd dist && ls *.apk) | sed 's/^/  /'
          KEEP_LIST="$(cd dist && ls *.apk 2>/dev/null || true)"
          # 注意：gh release view --json assets 的 id 是 GraphQL node id（RA_xxx），
          # REST 删除接口需要数字 id，必须走 gh api（且 gh api 不支持 -R，仓库写进路径）。
          gh api "repos/$REPO/releases/tags/$TAG" --jq '.assets[] | select(.name | endswith(".apk")) | "\(.id)\t\(.name)"' \
            > /tmp/assets.tsv || true
          while IFS=$'\t' read -r aid aname; do
            [ -z "$aid" ] && continue
            [ -z "$aname" ] && continue
            if printf '%s\n' "$KEEP_LIST" | grep -qx "$aname"; then
              continue
            fi
            echo "删除范围外资产：$aname (id=$aid)"
            if gh api -X DELETE "repos/$REPO/releases/assets/$aid" >/dev/null 2>&1; then
              echo "  已删除 $aname"
            else
              echo "  删除失败 $aname"
            fi
          done < /tmp/assets.tsv
          echo "最终资产："
          gh release view "$TAG" -R "$REPO" --json assets --jq '.assets[].name'

      - name: Publish update-channel manifest (供 app 内检查更新)
        if: steps.merge.outputs.changed == 'true' && inputs.test_mode != true
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          # 生成与 app 内 Updater 约定一致的 manifest.json，并挂到 update-channel release，
          # 使「关于 → 检查更新」能发现本项目构建并显示更新内容。
          set -euo pipefail
          REPO="${{ github.repository }}"
          CHANNEL_TAG="update-channel"
          VERSION_NAME="$(sed -n 's/^[[:space:]]*versionName[[:space:]]*"\([^"]*\)".*/\1/p' app/build.gradle | head -1)"
          VERSION_CODE="${{ steps.build.outputs.vcode }}"
          SHORT_SHA="$(git rev-parse --short=7 HEAD)"
          # leanback arm64 是 TV 主力包，作为默认 apk 目标
          APK_BASE="app-leanback-arm64_v8a-debug"
          BASE_URL="https://github.com/$REPO/releases/download/$TAG"

          for name in app-leanback-arm64_v8a app-leanback-armeabi_v7a app-mobile-arm64_v8a app-mobile-armeabi_v7a; do
            apk="dist/${name}-debug.apk"
            [ -f "$apk" ] || continue
            size=$(wc -c < "$apk" | tr -d ' ')
            sha256=$(sha256sum "$apk" | cut -d' ' -f1)
            python3 scripts/gen_update_manifest.py \
              "$name" "$TAG" "$VERSION_NAME" "$VERSION_CODE" "$SHORT_SHA" "$size" "$sha256" "$BASE_URL"
          done
          ls -lh dist/*.json 2>/dev/null || echo "no manifests generated"

          if gh release view "$CHANNEL_TAG" -R "$REPO" >/dev/null 2>&1; then
            gh release upload "$CHANNEL_TAG" -R "$REPO" dist/*.json --clobber
            echo "update-channel manifests updated"
          else
            gh release create "$CHANNEL_TAG" -R "$REPO" --target main \
              --title "Update channel manifests" \
              --notes "本项目(qznet/webhtv-silent1566)自动更新清单，供 app 内检查更新使用。" \
              --prerelease dist/*.json
            echo "update-channel release created"
          fi

      - name: Upload build artifacts (fallback)
        if: steps.merge.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: weekly-apks-test-${{ github.run_id }}
          path: dist/*.apk
          if-no-files-found: warn
          retention-days: 30
