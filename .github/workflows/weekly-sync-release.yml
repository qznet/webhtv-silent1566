name: Weekly Sync Upstream & Release

on:
  schedule:
    - cron: "0 18 * * 0"   # 每周一 02:00 北京时间（UTC 周日 18:00）
  workflow_dispatch:
    inputs:
      track:
        description: "跟随目标：auto=上游最新发布版（正式或 beta，哪个新跟哪个）；beta=仅最新 beta 预发布；main=上游 main 分支；ref=手动指定"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - beta
          - main
          - ref
      upstream_ref:
        description: "仅当 track=ref 时使用：上游分支/标签名"
        required: false
        default: "main"
        type: string
      force_release:
        description: "Force release even if no upstream change"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  TZ: Asia/Shanghai

jobs:
  sync-and-release:
    name: Sync upstream, build 4 APKs, release
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.email "action@webhtv.local"
          git config user.name "sync-bot"

      - name: Merge upstream (Silent1566)
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
          TRACK: ${{ inputs.track || 'auto' }}
          UPSTREAM_REF: ${{ inputs.upstream_ref || 'main' }}
        run: |
          git remote add upstream https://github.com/Silent1566/webhtv.git || true
          git remote set-url upstream https://github.com/Silent1566/webhtv.git
          git fetch upstream --tags --force

          # 解析合并目标：auto=最新发布版(正式或beta) / beta / main / 手动 ref
          TARGET=""
          case "$TRACK" in
            auto)
              # 取最新发布的非草稿 release（正式版与 beta 混在一起比 published_at，谁新跟谁）
              TARGET="$(gh api repos/Silent1566/webhtv/releases \
                --jq '[.[] | select(.draft == false)] | sort_by(.published_at) | last | .tag_name')"
              ;;
            beta)
              TARGET="$(gh api repos/Silent1566/webhtv/releases \
                --jq '[.[] | select(.draft == false and .prerelease == true)] | sort_by(.published_at) | last | .tag_name')"
              ;;
            main) TARGET="main" ;;
            ref)  TARGET="$UPSTREAM_REF" ;;
            *)    TARGET="main" ;;
          esac
          if [ -z "$TARGET" ]; then
            echo "::error title=No upstream target::Failed to resolve beta tag or ref"
            exit 1
          fi
          echo "Track mode: $TRACK -> target: $TARGET"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "Upstream target commit: $(git rev-parse --short upstream/$TARGET 2>/dev/null || echo 'tag-only, fetch by tag')"

          # beta 可能是仅存在于 tag 的提交，先确保该 target 对象已取到
          git fetch upstream "refs/tags/$TARGET:refs/tags/upstream-$TARGET" 2>/dev/null || true
          if git rev-parse --verify --quiet "upstream/$TARGET" >/dev/null; then
            REF_TO_MERGE="upstream/$TARGET"
          elif git rev-parse --verify --quiet "refs/tags/upstream-$TARGET" >/dev/null; then
            REF_TO_MERGE="refs/tags/upstream-$TARGET"
          else
            echo "::error title=Target not found::Cannot resolve upstream/$TARGET"
            exit 1
          fi
          echo "Merging: $REF_TO_MERGE"

          BEFORE=$(git rev-parse HEAD)
          git merge -X theirs --no-commit --no-edit "$REF_TO_MERGE" || true
          git checkout $BEFORE -- .github
          if git diff --cached --quiet; then
            git merge --abort 2>/dev/null || true
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No upstream changes."
          else
            git commit --no-edit
            AFTER=$(git rev-parse HEAD)
            if [ "$BEFORE" != "$AFTER" ]; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "changed=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Push main
        if: steps.merge.outputs.changed == 'true'
        run: git push origin main

      - name: Set up JDK 21
        if: steps.merge.outputs.changed == 'true' || inputs.force_release == true
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Python 3.10
        if: steps.merge.outputs.changed == 'true' || inputs.force_release == true
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Android SDK
        if: steps.merge.outputs.changed == 'true' || inputs.force_release == true
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android packages
        if: steps.merge.outputs.changed == 'true' || inputs.force_release == true
        run: |
          sdkmanager "platform-tools" "platforms;android-28" "build-tools;36.0.0"
          curl -fsSL -o /tmp/platform-37.zip https://dl.google.com/android/repository/platform-37.0_r01.zip
          rm -rf /tmp/platform-37 "$ANDROID_HOME/platforms/android-37"
          mkdir -p /tmp/platform-37 "$ANDROID_HOME/platforms"
          unzip -q /tmp/platform-37.zip -d /tmp/platform-37
          platform_jar="$(find /tmp/platform-37 -name android.jar -print -quit)"
          test -n "$platform_jar"
          mv "$(dirname "$platform_jar")" "$ANDROID_HOME/platforms/android-37"

      - name: Grant execute permission for gradlew
        if: steps.merge.outputs.changed == 'true' || inputs.force_release == true
        run: chmod +x ./gradlew

      - name: Drop JetBrains daemon JVM toolchain (foojay 400 workaround)
        if: steps.merge.outputs.changed == 'true' || inputs.force_release == true
        run: |
          # gradle/gradle-daemon-jvm.properties 强制用 JetBrains JDK 21 并走 foojay 下载，
          # 当前 foojay 对该 ID 返回 400 导致守护进程起不来。删除后 Gradle 改用已装好的
          # Temurin JDK 21（setup-java 提供）运行守护进程，编译不受影响。仅改工作树，不提交。
          rm -f gradle/gradle-daemon-jvm.properties
          echo "org.gradle.java.installations.auto-download=false" >> gradle.properties

      - name: Build four debug APKs
        if: steps.merge.outputs.changed == 'true' || inputs.force_release == true
        run: |
          ./gradlew \
            :app:assembleMobileArm64_v8aDebug \
            :app:assembleMobileArmeabi_v7aDebug \
            :app:assembleLeanbackArm64_v8aDebug \
            :app:assembleLeanbackArmeabi_v7aDebug \
            --no-daemon

      - name: Collect artifacts
        if: steps.merge.outputs.changed == 'true' || inputs.force_release == true
        run: |
          rm -rf dist
          mkdir -p dist
          find app/build/outputs/apk -name '*.apk' -exec cp {} dist/ \;
          ls -lh dist/

      - name: Resolve release tag
        id: meta
        if: steps.merge.outputs.changed == 'true' || inputs.force_release == true
        env:
          TARGET: ${{ steps.merge.outputs.target }}
          TRACK: ${{ inputs.track || 'auto' }}
        run: |
          VERSION_NAME="$(sed -n 's/^[[:space:]]*versionName[[:space:]]*"\([^"]*\)".*/\1/p' app/build.gradle | head -1)"
          # 跟随上游 tag 时保留其 beta 标识（去掉版本号前缀避免重复 v5.6.0-sync-5.6.0-...）
          PRERELEASE=false
          if [[ "$TARGET" == *-beta-* ]] && [ "$TARGET" != "main" ] && [ -n "$TARGET" ]; then
            TAG="v${VERSION_NAME}-sync-beta-${TARGET##*-beta-}"   # v5.6.0-beta-202610052020 -> v5.6.0-sync-beta-202610052020
            PRERELEASE=true
          else
            TAG="v${VERSION_NAME}-weekly-$(date +%Y%m%d)"
            PRERELEASE=false
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "Source: track=$TRACK target=$TARGET"

      - name: Create GitHub Release
        if: steps.merge.outputs.changed == 'true' || inputs.force_release == true
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        run: |
          REPO="${{ github.repository }}"
          PRERELEASE_FLAG=""
          if [ "$PRERELEASE" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          if gh release view "${{ steps.meta.outputs.tag }}" -R "$REPO" >/dev/null 2>&1; then
            gh release upload "${{ steps.meta.outputs.tag }}" -R "$REPO" dist/*.apk --clobber
          else
            gh release create "${{ steps.meta.outputs.tag }}" \
              -R "$REPO" \
              --target main \
              --title "${{ steps.meta.outputs.tag }}" \
              --notes "自动跟随上游 Silent1566/webhtv（track=${{ inputs.track || 'auto' }}，target=${{ steps.merge.outputs.target }}）构建的调试版，可直接 sideload。" \
              $PRERELEASE_FLAG \
              dist/*.apk
          fi

      - name: Upload build artifacts (fallback)
        if: always() && (steps.merge.outputs.changed == 'true' || inputs.force_release == true)
        uses: actions/upload-artifact@v4
        with:
          name: weekly-apks-${{ steps.meta.outputs.tag }}
          path: dist/*.apk
          if-no-files-found: warn
          retention-days: 30
